<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" role="img" aria-label="anonx status output">
  <defs>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#21262d"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <style>.m{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,Consolas,monospace;font-size:15px;}</style>
  </defs>

  <!-- 3D slab thickness -->
  <rect x="30" y="34" width="760" height="452" rx="16" fill="#04060a"/>
  <!-- window -->
  <g filter="url(#drop)">
    <rect x="30" y="24" width="760" height="452" rx="16" fill="#0b0e14" stroke="#30363d" stroke-width="1.2"/>
  </g>
  <!-- title bar -->
  <path d="M46 24 H774 A16 16 0 0 1 790 40 V66 H30 V40 A16 16 0 0 1 46 24 Z" fill="url(#titlebar)"/>
  <rect x="30" y="24" width="760" height="20" rx="16" fill="url(#gloss)"/>
  <line x1="30" y1="66" x2="790" y2="66" stroke="#30363d" stroke-width="1"/>
  <circle cx="56" cy="45" r="7" fill="#ff5f56"/>
  <circle cx="80" cy="45" r="7" fill="#ffbd2e"/>
  <circle cx="104" cy="45" r="7" fill="#27c93f"/>
  <text x="410" y="50" class="m" font-size="14" fill="#8b949e" text-anchor="middle">sid@kali: ~  —  anonx status</text>

  <g class="m">
    <!-- prompt -->
    <text x="52" y="100"><tspan fill="#56d364" font-weight="700">❯ </tspan><tspan fill="#e6edf3">sudo anonx status</tspan></text>
    <rect x="243" y="88" width="9" height="16" fill="#56d364"><animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></rect>

    <!-- verdict chip -->
    <rect x="52" y="120" width="122" height="26" rx="6" fill="#3fb950"/>
    <text x="113" y="138" fill="#03130a" font-weight="800" text-anchor="middle">ANONYMOUS</text>
    <text x="188" y="138" fill="#8b949e">everything on this machine leaves through Tor</text>

    <line x1="52" y1="158" x2="700" y2="158" stroke="#21262d" stroke-width="1.5"/>

    <!-- rows -->
    <text x="52" y="188"><tspan fill="#3fb950" font-weight="700">✔</tspan></text>
    <text x="86" y="188" fill="#e6edf3" font-weight="700">Tor</text>
    <text x="196" y="188"><tspan fill="#56d364" font-weight="700">running</tspan><tspan fill="#6e7681"> · fully connected to the Tor network</tspan></text>

    <text x="52" y="215"><tspan fill="#3fb950" font-weight="700">✔</tspan></text>
    <text x="86" y="215" fill="#e6edf3" font-weight="700">Firewall</text>
    <text x="196" y="215"><tspan fill="#56d364" font-weight="700">locked</tspan><tspan fill="#6e7681"> · anything not going through Tor is blocked</tspan></text>

    <text x="52" y="242"><tspan fill="#3fb950" font-weight="700">✔</tspan></text>
    <text x="86" y="242" fill="#e6edf3" font-weight="700">Public IP</text>
    <text x="196" y="242"><tspan fill="#e3b341" font-weight="700">185.220.101.178</tspan><tspan fill="#6e7681"> · a Tor exit node, not you</tspan></text>

    <text x="52" y="269"><tspan fill="#3fb950" font-weight="700">✔</tspan></text>
    <text x="86" y="269" fill="#e6edf3" font-weight="700">MAC eth0</text>
    <text x="196" y="269"><tspan fill="#bc8cff" font-weight="700">ea:52:86:8f:c8:eb</tspan><tspan fill="#56d364"> fake</tspan><tspan fill="#6e7681"> (real aa:bb:cc:dd:ee:ff)</tspan></text>
    <text x="196" y="290" fill="#6e7681">· your internet goes out through this link</text>

    <text x="52" y="317"><tspan fill="#3fb950" font-weight="700">✔</tspan></text>
    <text x="86" y="317" fill="#e6edf3" font-weight="700">IPv6</text>
    <text x="196" y="317"><tspan fill="#56d364" font-weight="700">blocked</tspan><tspan fill="#6e7681"> · Tor is IPv4-only, so v6 would expose you</tspan></text>

    <text x="52" y="344"><tspan fill="#3fb950" font-weight="700">✔</tspan></text>
    <text x="86" y="344" fill="#e6edf3" font-weight="700">DNS</text>
    <text x="196" y="344"><tspan fill="#56d364" font-weight="700">inside Tor</tspan><tspan fill="#6e7681"> · your ISP cannot see the sites you look up</tspan></text>

    <text x="52" y="371"><tspan fill="#3fb950" font-weight="700">✔</tspan></text>
    <text x="86" y="371" fill="#e6edf3" font-weight="700">New IP</text>
    <text x="196" y="371"><tspan fill="#56d364" font-weight="700">automatic</tspan><tspan fill="#6e7681"> · every 30s</tspan></text>

    <line x1="52" y1="392" x2="700" y2="392" stroke="#21262d" stroke-width="1.5"/>

    <text x="52" y="420"><tspan fill="#6e7681">go back to normal:  </tspan><tspan fill="#56d364" font-weight="700">sudo anonx stop</tspan></text>
    <text x="52" y="446"><tspan fill="#484f58">anonx v1.0 · </tspan><tspan fill="#39c5cf">sid-hack3r</tspan></text>
  </g>
</svg>
